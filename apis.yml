aid: superlog
name: Superlog
description: >-
  Superlog is an AI-native, open-core observability platform (Y Combinator, Spring 2026)
  that ingests OpenTelemetry traces, logs, and metrics over OTLP, groups noisy signals into
  incidents, and dispatches AI agents to investigate root causes and open fix pull requests
  automatically. It offers a Management REST API for provisioning projects and ingest keys,
  OTLP ingest endpoints, a hosted Model Context Protocol (MCP) server so coding assistants
  like Claude and Cursor can query telemetry and incidents, signed incident webhooks, and
  GitHub/Slack/Linear/AWS integrations. The Community edition is Apache-2.0 licensed and
  self-hostable via Docker Compose; Superlog Cloud is the managed offering.
